<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SemiSkill — Command Centre</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<style>
/* ── shadcn/ui token system (dark, tweakcn-flavoured) ─────────────────────── */
:root{
  --background:240 10% 3.9%;   --foreground:0 0% 98%;
  --card:240 8% 5.5%;          --card-foreground:0 0% 98%;
  --popover:240 10% 7%;        --popover-foreground:0 0% 98%;
  --primary:162 72% 46%;       --primary-foreground:160 30% 6%;
  --secondary:240 4% 12%;      --secondary-foreground:0 0% 96%;
  --muted:240 4% 11%;          --muted-foreground:240 5% 62%;
  --accent:240 5% 15%;         --accent-foreground:0 0% 98%;
  --destructive:358 72% 56%;   --destructive-foreground:0 0% 98%;
  --warning:38 92% 55%;        --success:151 66% 47%;  --info:212 92% 62%;
  --border:240 5% 14%;         --input:240 5% 16%;     --ring:162 72% 46%;
  --radius:.65rem;
  --chart-1:162 72% 46%; --chart-2:212 92% 62%; --chart-3:266 78% 68%;
  --chart-4:38 92% 55%;  --chart-5:358 72% 56%; --chart-6:180 60% 50%;
  --sidebar:240 9% 4.6%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:hsl(var(--background));color:hsl(var(--foreground));
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:hsl(var(--border));border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:hsl(var(--accent))}
a{color:inherit}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace}

/* ── shell ─────────────────────────────────────────────────────────────────── */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{
  background:hsl(var(--sidebar));border-right:1px solid hsl(var(--border));
  padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .logo{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(145deg,hsl(var(--primary)),hsl(var(--chart-2)));
  color:hsl(var(--primary-foreground));font-weight:800;font-size:15px;
}
.brand b{font-size:14px;letter-spacing:-.01em;display:block}
.brand span{font-size:11px;color:hsl(var(--muted-foreground))}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:hsl(var(--muted-foreground));padding:14px 8px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:calc(var(--radius) - 2px);
  color:hsl(var(--muted-foreground));cursor:pointer;font-weight:500;font-size:13.5px;border:1px solid transparent;
  transition:background .12s,color .12s;user-select:none;width:100%;background:transparent;
  text-align:left;font-family:inherit;appearance:none;
}
.nav-item:hover{background:hsl(var(--accent));color:hsl(var(--foreground))}
.nav-item.active{background:hsl(var(--accent));color:hsl(var(--foreground));border-color:hsl(var(--border))}
.nav-item:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
.nav-item .ico{width:16px;text-align:center;opacity:.9}
.nav-item .n{margin-left:auto;font-size:11px;color:hsl(var(--muted-foreground));
  background:hsl(var(--muted));border-radius:6px;padding:1px 6px}
main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
  background:hsl(var(--background)/.82);border-bottom:1px solid hsl(var(--border));
  padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.topbar .sub{font-size:12px;color:hsl(var(--muted-foreground))}
.spacer{flex:1}
.view{padding:20px 24px 56px;display:none;animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.section-head{display:flex;align-items:flex-end;gap:12px;margin:26px 0 12px}
.section-head:first-child{margin-top:4px}
.section-head h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.section-head p{font-size:12.5px;color:hsl(var(--muted-foreground))}

/* ── primitives ────────────────────────────────────────────────────────────── */
.card{
  background:hsl(var(--card));border:1px solid hsl(var(--border));
  border-radius:var(--radius);color:hsl(var(--card-foreground));overflow:hidden;
}
.card-header{padding:16px 18px 0;display:flex;align-items:flex-start;gap:10px}
.card-header .t{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.card-header .d{font-size:12px;color:hsl(var(--muted-foreground));margin-top:2px}
.card-content{padding:14px 18px 18px}
.card-content.tight{padding:10px 12px 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
@media(max-width:1180px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){#app{grid-template-columns:1fr}.sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.nav-label{display:none}.g2,.g3,.g4,.g6{grid-template-columns:1fr}.span2{grid-column:auto}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  border-radius:calc(var(--radius) - 2px);font-size:12.5px;font-weight:500;padding:6px 11px;
  border:1px solid hsl(var(--border));background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));
  cursor:pointer;transition:background .12s,border-color .12s,opacity .12s;
}
.btn:hover{background:hsl(var(--accent))}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:hsl(var(--primary));font-weight:600}
.btn.primary:hover{opacity:.9;background:hsl(var(--primary))}
.btn.ghost{background:transparent;border-color:transparent;color:hsl(var(--muted-foreground))}
.btn.ghost:hover{background:hsl(var(--accent));color:hsl(var(--foreground))}
.btn.outline{background:transparent}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

.badge{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;
  font-size:11px;font-weight:600;border:1px solid hsl(var(--border));background:hsl(var(--muted));
  color:hsl(var(--muted-foreground));white-space:nowrap;line-height:1.5;
}
.badge.done,.badge.up,.badge.success{background:hsl(var(--success)/.13);color:hsl(var(--success));border-color:hsl(var(--success)/.3)}
.badge.partial,.badge.warn,.badge.todo{background:hsl(var(--warning)/.13);color:hsl(var(--warning));border-color:hsl(var(--warning)/.3)}
.badge.gap,.badge.down,.badge.critical,.badge.destructive{background:hsl(var(--destructive)/.13);color:hsl(var(--destructive));border-color:hsl(var(--destructive)/.3)}
.badge.info,.badge.live{background:hsl(var(--info)/.13);color:hsl(var(--info));border-color:hsl(var(--info)/.3)}
.badge.by-design-off,.badge.muted{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.dot{width:7px;height:7px;border-radius:99px;background:currentColor;box-shadow:0 0 0 3px currentColor;opacity:.9;transform:scale(.85)}
.pulse{animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--muted-foreground));font-weight:600}
.kpi .s{font-size:11.5px;color:hsl(var(--muted-foreground));margin-top:3px}

.progress{height:7px;border-radius:99px;background:hsl(var(--muted));overflow:hidden}
.progress>span{display:block;height:100%;border-radius:99px;background:hsl(var(--primary));transition:width .5s ease}
.progress.warn>span{background:hsl(var(--warning))}
.progress.bad>span{background:hsl(var(--destructive))}

table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  color:hsl(var(--muted-foreground));padding:8px 10px;border-bottom:1px solid hsl(var(--border));
  position:sticky;top:0;background:hsl(var(--card));cursor:pointer;user-select:none;white-space:nowrap;
}
thead th:hover{color:hsl(var(--foreground))}
tbody td{padding:8px 10px;border-bottom:1px solid hsl(var(--border)/.7);vertical-align:top}
tbody tr:hover{background:hsl(var(--accent)/.5)}
tbody tr:last-child td{border-bottom:none}
.tbl-wrap{max-height:520px;overflow:auto;border-radius:calc(var(--radius) - 2px)}
.muted{color:hsl(var(--muted-foreground))}
.num{font-variant-numeric:tabular-nums;text-align:right}

input[type=text],input[type=search],select,textarea{
  background:hsl(var(--muted));border:1px solid hsl(var(--input));color:hsl(var(--foreground));
  border-radius:calc(var(--radius) - 2px);padding:6px 10px;font-size:12.5px;font-family:inherit;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:hsl(var(--ring));box-shadow:0 0 0 3px hsl(var(--ring)/.16)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

.chart-box{position:relative;height:240px}
.chart-box.tall{height:320px}
.chart-box.short{height:180px}

/* diagrams */
svg .lbl{font:600 11px Inter,system-ui,sans-serif;fill:hsl(var(--foreground))}
svg .sub{font:10px Inter,system-ui,sans-serif;fill:hsl(var(--muted-foreground))}
svg .box{fill:hsl(var(--muted));stroke:hsl(var(--border))}
svg .flow{stroke:hsl(var(--border));stroke-width:1.5;fill:none;marker-end:url(#arrow)}
svg .flow.ok{stroke:hsl(var(--primary))}
svg .flow.bad{stroke:hsl(var(--destructive));stroke-dasharray:4 3}

.tree{font-size:12.5px;line-height:1.9}
.tree .n{display:flex;align-items:center;gap:8px}
.tree .n .bar{height:5px;border-radius:99px;background:hsl(var(--primary)/.55);min-width:2px}
.tree .lvl1{padding-left:14px}.tree .lvl2{padding-left:30px}
.tree .grp{font-weight:600}

.matrix{display:grid;gap:4px;font-size:11px}
.matrix .cell{border:1px solid hsl(var(--border));border-radius:6px;padding:6px 4px;text-align:center;background:hsl(var(--muted))}
.matrix .cell.on{background:hsl(var(--primary)/.22);border-color:hsl(var(--primary)/.5);color:hsl(var(--foreground));font-weight:600}
.matrix button.cell{color:inherit;font:inherit;cursor:pointer;min-height:32px}
.matrix button.cell:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
.matrix .hdr{color:hsl(var(--muted-foreground));font-weight:600;text-align:center;padding:4px 2px;border:none;background:none}

.gantt-row{display:grid;grid-template-columns:210px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.gantt-track{position:relative;height:26px;background:hsl(var(--muted));border-radius:7px;overflow:hidden}
.gantt-bar{position:absolute;top:3px;height:20px;border-radius:6px;display:flex;align-items:center;padding:0 8px;
  font-size:10.5px;font-weight:600;color:hsl(var(--primary-foreground));white-space:nowrap;overflow:hidden}

.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.funnel-bar{height:30px;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-size:11.5px;font-weight:600;
  color:hsl(var(--primary-foreground));min-width:60px}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);background:hsl(var(--muted)/.4)}
.row .g{flex:1;min-width:0}
.row .h{font-weight:600;font-size:12.5px}
.row .p{font-size:11.5px;color:hsl(var(--muted-foreground));margin-top:2px}

.stat-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
pre.out{background:hsl(var(--muted));border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);
  padding:10px;font-size:11px;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word}

#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.toast{background:hsl(var(--popover));border:1px solid hsl(var(--border));border-radius:var(--radius);
  padding:11px 14px;font-size:12.5px;min-width:260px;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:fade .2s}
.toast b{display:block;margin-bottom:2px}
dialog{background:hsl(var(--popover));color:hsl(var(--foreground));border:1px solid hsl(var(--border));
  border-radius:var(--radius);padding:0;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
.dlg-head{padding:16px 18px 0}.dlg-body{padding:12px 18px}.dlg-foot{padding:0 18px 16px;display:flex;gap:8px;justify-content:flex-end}
textarea{width:100%;min-height:110px;resize:vertical}
.empty{padding:26px;text-align:center;color:hsl(var(--muted-foreground));font-size:12.5px}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">S</div>
      <div><b>SemiSkill</b><span>Command Centre</span></div>
    </div>
    <div class="nav-label">Build</div>
    <button type="button" class="nav-item active" data-view="overview" aria-current="page"><span class="ico">◎</span>Overview</button>
    <button type="button" class="nav-item" data-view="architecture"><span class="ico">▤</span>Architecture</button>
    <button type="button" class="nav-item" data-view="pipeline"><span class="ico">⇉</span>Pipeline</button>
    <button type="button" class="nav-item" data-view="features"><span class="ico">✦</span>Features<span class="n" id="n-features">–</span></button>
    <button type="button" class="nav-item" data-view="quality"><span class="ico">✓</span>Quality &amp; Bugs<span class="n" id="n-tests">–</span></button>
    <div class="nav-label">Product</div>
    <button type="button" class="nav-item" data-view="security"><span class="ico">⛨</span>Security<span class="n" id="n-attacks">–</span></button>
    <button type="button" class="nav-item" data-view="catalog"><span class="ico">▩</span>Catalog<span class="n" id="n-published">–</span></button>
    <div class="nav-label">Business</div>
    <button type="button" class="nav-item" data-view="launch"><span class="ico">🚀</span>Launch</button>
    <button type="button" class="nav-item" data-view="growth"><span class="ico">📈</span>Growth &amp; GTM</button>
    <button type="button" class="nav-item" data-view="analytics"><span class="ico">◫</span>Analytics</button>
    <div class="nav-label">Control</div>
    <button type="button" class="nav-item" data-view="queue"><span class="ico">⌘</span>Action Queue<span class="n" id="n-queue">0</span></button>
    <div style="flex:1"></div>
    <div class="muted" style="font-size:11px;margin-top:12px">Only integrity-pinned schema-v1 server templates can enter the request queue.</div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="page-title">Overview</h1>
        <div class="sub" id="page-sub">Loading live state…</div>
      </div>
      <div class="spacer"></div>
      <div class="stat-strip" id="health"></div>
      <span id="request-session-status" class="sr-only" role="status" aria-live="polite">Request controls unavailable; activate Refresh.</span>
      <button type="button" class="btn" id="btn-refresh">↻ Refresh</button>
    </header>

    <section class="view active" id="view-overview"></section>
    <section class="view" id="view-architecture"></section>
    <section class="view" id="view-pipeline"></section>
    <section class="view" id="view-features"></section>
    <section class="view" id="view-quality"></section>
    <section class="view" id="view-security"></section>
    <section class="view" id="view-catalog"></section>
    <section class="view" id="view-launch"></section>
    <section class="view" id="view-growth"></section>
    <section class="view" id="view-analytics"></section>
    <section class="view" id="view-queue"></section>
  </main>
</div>

<div id="toast" role="status" aria-live="polite" aria-atomic="false"></div>

<div id="action-error" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script>
/* ═══════════════════════════ state + utils ═══════════════════════════════ */
let S = null, SESSION = null, LAST_RECEIPT = null, LAST_ARCHIVE = null, CHARTS = {}, VIEW = 'overview';
function loadPendingRequests() {
  try {
    const parsed = JSON.parse(sessionStorage.getItem('semiskill.pending-requests') || '{}');
    return new Map(Object.entries(parsed).filter(([, value]) => /^[0-9a-f-]{36}$/.test(value)));
  } catch (error) { return new Map(); }
}
const PENDING_REQUESTS = loadPendingRequests();
let PENDING_ARCHIVE_ID = (() => {
  try {
    const value = sessionStorage.getItem('semiskill.pending-archive');
    return value && /^[0-9a-f-]{36}$/.test(value) ? value : null;
  } catch (error) { return null; }
})();
function persistPendingRequests() {
  try {
    sessionStorage.setItem('semiskill.pending-requests', JSON.stringify(Object.fromEntries(PENDING_REQUESTS)));
    if (PENDING_ARCHIVE_ID) sessionStorage.setItem('semiskill.pending-archive', PENDING_ARCHIVE_ID);
    else sessionStorage.removeItem('semiskill.pending-archive');
  } catch (error) { /* idempotency remains in-memory when storage is unavailable */ }
}
const $ = s => document.querySelector(s);
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hsl = (n, a = 1) => `hsl(${CSS(n)} / ${a})`;
const PALETTE = () => ['--chart-1','--chart-2','--chart-3','--chart-4','--chart-5','--chart-6'].map(v => hsl(v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

function toast(title, body, kind) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.innerHTML = `<b>${kind === 'bad' ? '⚠ ' : '✓ '}${esc(title)}</b><span class="muted">${esc(body || '')}</span>`;
  $('#toast').appendChild(d);
  if (kind === 'bad') $('#action-error').textContent = `${title}. ${body || ''}`;
  setTimeout(() => d.remove(), 4200);
}

async function api(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', ...(opts || {}) });
  if (!r.ok) {
    const error = new Error(await r.text());
    error.status = r.status;
    throw error;
  }
  return r.json();
}
const definitiveRejection = status => [400, 403, 404, 405, 409, 411, 413, 415, 421, 422].includes(status);

function syncMutationControls() {
  document.querySelectorAll('[data-action-id], #q-archive').forEach(button => {
    button.type = 'button';
    const template = S?.model?.actions.find(action => action.id === button.dataset.actionId);
    if (template && !button.hasAttribute('aria-label')) {
      button.setAttribute('aria-label', `Queue request: ${template.label}`);
    }
    if (!SESSION) {
      button.disabled = true;
      button.setAttribute('title', 'Click Refresh to establish a new same-origin request session.');
    } else if (button.getAttribute('aria-busy') !== 'true') {
      button.disabled = false;
      button.removeAttribute('title');
    }
  });
  const status = $('#request-session-status');
  if (status) status.textContent = SESSION
    ? 'Prepared-request controls available.'
    : 'Request controls unavailable; activate Refresh.';
}

/* card helper — every card can carry a "work on this" action button */
function card(title, desc, body, opts = {}) {
  const template = opts.action ? S?.model?.actions.find(action => action.id === opts.action) : null;
  const act = opts.action ? `<button type="button" class="btn xs outline" data-action-id="${esc(opts.action)}" aria-label="Queue request: ${esc(template?.label || 'prepared section request')}">⌘ Queue section request</button>` : '';
  const extra = opts.extra || '';
  return `<div class="card ${opts.cls || ''}">
    <div class="card-header"><div style="flex:1;min-width:0"><div class="t">${title}</div>${desc ? `<div class="d">${desc}</div>` : ''}</div>
    <div style="display:flex;gap:6px;flex:0 0 auto">${extra}${act}</div></div>
    <div class="card-content ${opts.tight ? 'tight' : ''}">${body}</div></div>`;
}
function kpi(label, value, sub, opts = {}) {
  return `<div class="card kpi"><div class="card-content">
    <div class="l">${label}</div><div class="v" style="${opts.color ? `color:${opts.color}` : ''}">${value}</div>
    <div class="s">${sub || ''}</div>
    ${opts.progress !== undefined ? `<div class="progress ${opts.progressCls || ''}" style="margin-top:10px"><span style="width:${opts.progress}%"></span></div>` : ''}
  </div></div>`;
}
function badge(text, cls) { return `<span class="badge ${cls || ''}">${esc(text)}</span>`; }
function canonicalSnapshot() {
  return S?.scoreboard?.status === 'available' && S?.scoreboard?.validation?.status === 'verified'
    ? S.scoreboard.snapshot : null;
}
function freshness(iso) {
  const at = Date.parse(iso);
  if (!Number.isFinite(at)) return 'freshness unknown';
  const age = Date.now() - at;
  if (age < -60000) return 'clock skew detected';
  const seconds = Math.max(0, Math.floor(age / 1000));
  if (seconds < 60) return `${seconds}s old`;
  const minutes = Math.floor(seconds / 60);
  return minutes < 60 ? `${minutes}m old` : `${Math.floor(minutes / 60)}h old`;
}

function chart(id, cfg) {
  const el = document.getElementById(id);
  if (!el) return;
  if (typeof Chart === 'undefined') {
    el.style.display = 'none';
    if (!document.getElementById(`${id}-unavailable`)) {
      const notice = document.createElement('div');
      notice.id = `${id}-unavailable`;
      notice.className = 'empty';
      notice.textContent = 'Chart unavailable; the source KPIs, tables and diagrams remain visible.';
      el.parentElement.appendChild(notice);
    }
    return;
  }
  if (CHARTS[id]) CHARTS[id].destroy();
  Chart.defaults.color = hsl('--muted-foreground');
  Chart.defaults.borderColor = hsl('--border');
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
  Chart.defaults.font.size = 11;
  cfg.options = Object.assign({
    responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
  }, cfg.options || {});
  CHARTS[id] = new Chart(el.getContext('2d'), cfg);
}
const gridOpts = (stacked = false) => ({
  x: { stacked, grid: { display: false }, border: { color: hsl('--border') } },
  y: { stacked, beginAtZero: true, grid: { color: hsl('--border', .55) }, border: { display: false } }
});

function readiness() {
  const lc = S.model.launch_checklist;
  const w = lc.reduce((a, x) => a + x.weight, 0);
  const got = lc.reduce((a, x) => a + x.weight * (x.status === 'done' ? 1 : x.status === 'partial' ? .5 : 0), 0);
  return { pct: Math.round(got / w * 100), done: lc.filter(x => x.status === 'done').length, total: lc.length };
}

let fFilter = { layer: 'all', status: 'all', q: '' };
function filteredFeatures(features) {
  return features.filter(x =>
    (fFilter.layer === 'all' || x.layer === fFilter.layer) &&
    (fFilter.status === 'all' || x.status === fFilter.status) &&
    (!fFilter.q || (x.name + x.note + x.evidence).toLowerCase().includes(fFilter.q.toLowerCase())));

function featureTableRows(rows) {

/* ── launch ───────────────────────────────────────────────────────────────── */
function vLaunch() {
  const lc = S.model.launch_checklist, R = readiness();
  const releaseSnapshot = canonicalSnapshot();
  const releaseGate = releaseSnapshot?.release_gate || null;
  const releaseStatus = releaseGate ? (releaseGate.passed === true ? 'PASS' : 'FAIL') : 'UNAVAILABLE';
  const sections = [...new Set(lc.map(x => x.section))];
  const secScore = sec => {
    const items = lc.filter(x => x.section === sec);
    const w = items.reduce((a, x) => a + x.weight, 0);
    const g = items.reduce((a, x) => a + x.weight * (x.status === 'done' ? 1 : x.status === 'partial' ? .5 : 0), 0);
    return Math.round(g / w * 100);
  };
  const tl = S.model.gtm.timeline, span = 72;

  $('#view-launch').innerHTML = `
    ${card('Deterministic release gate', releaseStatus,
      `<div style="font-size:12.5px;line-height:1.6">${releaseGate
        ? `${badge(releaseStatus, releaseGate.passed === true ? 'done' : 'gap')} source snapshot ${esc(releaseSnapshot.snapshot_id || 'unidentified')}`
        : `${badge('unavailable', 'gap')} No verified current scoreboard snapshot is available; launch is a hard no-go.`}</div>`)}
    <div class="grid g4">
      ${kpi('Curated plan completion', R.pct + '%', `${R.done} done · ${lc.filter(x => x.status === 'partial').length} partial · ${lc.filter(x => x.status === 'todo').length} to do; not the release gate`,
        { progress: R.pct, progressCls: R.pct < 40 ? 'bad' : R.pct < 70 ? 'warn' : '' })}
      ${kpi('High-weight plan items', lc.filter(x => x.status === 'todo' && x.weight === 3).length, 'curated weight-3 items still open', { color: hsl('--destructive') })}
      ${kpi('Open plan weight', lc.filter(x => x.status === 'todo').reduce((a, x) => a + x.weight, 0), 'curated weight points; not a duration forecast')}
      ${kpi('Planning target', 'Internal alpha', 'curated hypothesis: 3 design-partner guilds, then org-wide')}
    </div>

    <div class="grid g2" style="margin-top:14px">
      ${card('Planning completion by section', 'Curated and non-crediting; a weight-3 item counts triple', `<div class="chart-box"><canvas id="c-ready"></canvas></div>`)}

    const label = archive.textContent;
    archive.textContent = 'Archiving…';
    const requestId = PENDING_ARCHIVE_ID || crypto.randomUUID();

    persistPendingRequests();

      await refreshInbox();
    } catch (error) {
      toast('Archive accepted; list refresh delayed', `Recovery ${receipt.recovery_ref} remains authoritative.`);
    }
    vQueue();
  };
}

/* ═══════════════════════════ actions ═════════════════════════════════════ */
async function mutate(path, payload) {
  if (!SESSION?.csrf_token) throw new Error('request session unavailable');
  try {
    return await api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-SemiSkill-CSRF': SESSION.csrf_token },
      body: JSON.stringify(payload),
    });
  } catch (error) {
    if (error.status === 403) {
      SESSION = null;
      syncMutationControls();
      toast('Request session expired', 'Click Refresh, then click the request again. Nothing was replayed.', 'bad');
    }
    throw error;
  }
}

async function establishSession() {
  SESSION = await api('/api/session');
  syncMutationControls();
  return SESSION;
}

async function refreshInbox() {
  const listing = await api('/api/inbox');
  S.inbox = listing.inbox;
  $('#n-queue').textContent = S.inbox.filter(item => item.status === 'queued').length;
}

async function queue(templateId) {
  const template = S.model.actions.find(item => item.id === templateId);
  if (!template) throw new Error('unknown request template');
  const pendingKey = `${templateId}:${VIEW}`;
  const requestId = PENDING_REQUESTS.get(pendingKey) || crypto.randomUUID();
  PENDING_REQUESTS.set(pendingKey, requestId);
  persistPendingRequests();
  let receipt;
  try {
    receipt = await mutate('/api/action', {
      schema_version: 'semiskill.dashboard-action/v1',
      request_type: 'prepared',
      template_id: templateId,
      priority: 'normal',
      context: VIEW,
      request_id: requestId,
    });
  } catch (error) {
    if (definitiveRejection(error.status)) {
      PENDING_REQUESTS.delete(pendingKey);
      persistPendingRequests();
    }
    throw error;
  }
  PENDING_REQUESTS.delete(pendingKey);
  persistPendingRequests();
  LAST_RECEIPT = receipt;
  S.inbox.push({ ...receipt, title: template.label, context: VIEW, credit: 'none' });
  $('#n-queue').textContent = S.inbox.filter(item => item.status === 'queued').length;
  toast('Request queued', `${template.label} · receipt ${receipt.receipt_id}`);
  try {
    await refreshInbox();
  } catch (error) {
    toast('Request accepted; list refresh delayed', `Receipt ${receipt.receipt_id} remains authoritative.`);
  }
  if (VIEW === 'queue') vQueue();
  return receipt;
}

document.addEventListener('click', async ev => {
  const nav = ev.target.closest('.nav-item');
  if (nav) {
    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.remove('active');
      n.removeAttribute('aria-current');
    });
    nav.classList.add('active');
    nav.setAttribute('aria-current', 'page');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    VIEW = nav.dataset.view;
    document.getElementById('view-' + VIEW).classList.add('active');
    if (S) renderAll();
    window.scrollTo({ top: 0 });
    return;
  }
  const act = ev.target.closest('[data-action-id]');
  if (act) {
    const a = S.model.actions.find(x => x.id === act.dataset.actionId);
    if (a) {
      act.disabled = true;
      act.setAttribute('aria-busy', 'true');
      const label = act.textContent;
      act.textContent = 'Queueing…';
      try {
        await queue(a.id);
      } catch (e) {
        toast(
          definitiveRejection(e.status) ? 'Request rejected' : 'Request outcome uncertain',
          definitiveRejection(e.status)
            ? 'The request was not accepted; correct the session or template state and try again.'
            : 'Retry this control to reuse the same request ID; it will not duplicate accepted work.',
          'bad',
        );
      } finally {
        act.disabled = false;
        act.removeAttribute('aria-busy');
        act.textContent = label;
        syncMutationControls();
      }
    }
    return;
  }
});

/* ═══════════════════════════ boot ════════════════════════════════════════ */
async function refresh() {
  try {
    S = await api('/api/state');
    renderAll();
  } catch (e) {
    $('#view-overview').innerHTML = `<div class="card"><div class="card-content">
      <h2 style="margin-bottom:8px">Command centre state is unavailable</h2>
      <p class="muted" style="font-size:13px">This dashboard could not read or render live repository, database and queue state. If the local server is stopped, start it:</p>
      <pre class="out" style="margin-top:10px">python dashboard/server.py</pre>
      <p class="muted" style="font-size:12px;margin-top:8px">Then reload this page. Error: ${esc(String(e).slice(0, 200))}</p>
    </div></div>`;
  }
}
$('#btn-refresh').onclick = async () => {
  $('#btn-refresh').textContent = '↻ …';
  try {
    if (!SESSION) await establishSession();
    await refresh();
  } catch (error) {
    toast('Refresh failed', 'The command centre or request session is unavailable.', 'bad');
  } finally {
    $('#btn-refresh').textContent = '↻ Refresh';
  }
};
$('#view-overview').innerHTML = `<div class="card"><div class="card-content"><div class="empty">
  Reading live state from the repo, the database and the queue…</div></div></div>`;
async function boot() {
  try {
    await establishSession();
  } catch (e) {
    SESSION = null;
    toast('Request controls unavailable', 'Could not establish the same-origin request session.', 'bad');
  }
  await refresh();
}
boot();
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 15000);
</script>
